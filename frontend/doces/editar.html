<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>

Editar Doce

</title>


<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link
rel="stylesheet"
href="../style.css">

</head>


<body>


<nav class="navbar navbar-expand-lg">

<div class="container position-relative">


<button
class="navbar-toggler menu-button-left"

type="button"

data-bs-toggle="offcanvas"

data-bs-target="#menuLateral">

<span
class="navbar-toggler-icon">

</span>

</button>



<a
class="navbar-brand navbar-brand-center"

href="index.html">

Doceria

</a>



<div
class="offcanvas offcanvas-start"

id="menuLateral">

<div class="offcanvas-header">

<h5
class="titulo-menu">

Menu

</h5>


<button
class="btn-close"

data-bs-dismiss="offcanvas">

</button>

</div>



<div class="offcanvas-body">

<ul class="navbar-nav">

<li>

<a
class="nav-link"

href="../doces/index.html">

Doces

</a>

</li>



<li>

<a
class="nav-link"

href="../pedidos/index.html">

Pedidos

</a>

</li>


</ul>

</div>


</div>

</div>

</nav>




<div class="container mt-5">


<div class="card-custom">


<h1 class="titulo">

Editar Doce

</h1>



<form id="formEditar">


<div class="mb-3">

<label>

Nome

</label>


<input

id="nome"

class="form-control"

required>

</div>




<div class="mb-3">

<label>

Preço

</label>


<input

id="preco"

type="number"

step=".01"

class="form-control"

required>

</div>




<div class="mb-3">

<label>

Quantidade

</label>


<input

id="quantidade"

type="number"

class="form-control"

required>

</div>




<button
class="btn btn-custom">

Salvar

</button>



<a
href="index.html"

class="btn btn-secondary">

Cancelar

</a>


</form>



<div id="mensagem">

</div>



</div>


</div>





<script>


const params =
new URLSearchParams(
window.location.search
)


const id =
params.get("id")



document
.getElementById(
"formEditar"
)

.addEventListener(

"submit",

async function(e){

e.preventDefault()


const nome =
document
.getElementById(
"nome"
).value


const preco =
parseFloat(

document
.getElementById(
"preco"
).value

)


const quantidade =
parseInt(

document
.getElementById(
"quantidade"
).value

)




try{


const resposta =
await fetch(

`http://127.0.0.1:8000/doces/${id}`,

{

method:

"PUT",


headers:{

"Content-Type":

"application/json"

},


body:
JSON.stringify({

nome,

preco,

quantidade

})

}

)



if(
!resposta.ok
){

throw new Error()

}



document
.getElementById(
"mensagem"
)

.innerHTML=`

<div
class="alert alert-success">

Doce atualizado!

</div>

`


}
catch{


document
.getElementById(
"mensagem"
)

.innerHTML=`

<div
class="alert alert-danger">

Erro ao atualizar.

</div>

`

}


}


)


</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
