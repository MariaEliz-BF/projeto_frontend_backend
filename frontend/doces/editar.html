<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doces da Mel | Editar Doce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

</head>

<body>

<nav class="navbar">

    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand" href="../index.html">
            Doces da Mel
        </a>

        <button
            class="btn usuario-btn"
            id="btnLogout"
            title="Sair">

            <i class="bi bi-box-arrow-right"></i>

        </button>

    </div>

</nav>

<main class="container mt-5">

    <div class="card-custom">

        <h1 class="titulo mb-3">
            Editar Doce
        </h1>

        <p class="mb-4">
            Altere as informações do produto.
        </p>

        <form id="formDoce">

            <div class="mb-3">

                <label class="form-label">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Preço
                </label>

                <input
                    type="number"
                    id="preco"
                    class="form-control"
                    step="0.01"
                    min="0"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Quantidade em estoque
                </label>

                <input
                    type="number"
                    id="quantidade"
                    class="form-control"
                    min="0"
                    required>

            </div>

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-custom">

                    <i class="bi bi-check-circle me-1"></i>

                    Salvar Alterações

                </button>

                <a
                    href="index.html"
                    class="btn btn-outline-secondary">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>

<script>

protegerPagina();

document.getElementById("btnLogout")
    .addEventListener("click", sair);

const id = new URLSearchParams(window.location.search).get("id");

const campoNome = document.getElementById("nome");
const campoPreco = document.getElementById("preco");
const campoQuantidade = document.getElementById("quantidade");

async function carregarDoce() {

    if (!id) {

        mostrarToast("Produto não encontrado.", "erro");

        setTimeout(() => {

            window.location.href = "index.html";

        }, 1500);

        return;

    }

    const resposta = await api.get(`/doces/${id}`);

    if (!resposta.ok) {

        mostrarToast("Erro ao carregar doce.", "erro");

        return;

    }

    campoNome.value = resposta.data.nome;
    campoPreco.value = resposta.data.preco;
    campoQuantidade.value = resposta.data.quantidade;

}

document.getElementById("formDoce")
.addEventListener("submit", async (e)=>{

    e.preventDefault();

    confirmarAcao(

        "Salvar alterações",

        "Deseja realmente salvar as alterações deste doce?",

        async ()=>{

            const resposta = await api.put(`/doces/${id}/substituir`,{

                nome: campoNome.value.trim(),

                preco: Number(campoPreco.value),

                quantidade: Number(campoQuantidade.value)

            });

            if(!resposta.ok){

                mostrarToast(
                    resposta.data?.detail || "Erro ao atualizar.",
                    "erro"
                );

                return;

            }

            mostrarToast("Doce atualizado com sucesso!");

            setTimeout(()=>{

                window.location.href="index.html";

            },1500);

        },

        "Salvar"

    );

});

carregarDoce();

</script>

</body>

</html>
