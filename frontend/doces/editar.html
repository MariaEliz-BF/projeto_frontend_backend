<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doceria - Editar Doce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

        <nav class="navbar">
            <div class="container d-flex justify-content-between align-items-center">
                <a class="navbar-brand" href="../index.html">Doceria</a>

                <div class="usuario-area">
                    <span id="usuarioLogado" class="usuario-logado"></span>

                    <button class="btn usuario-btn" onclick="sair()" title="Sair">
                        <i class="bi bi-person-circle"></i>
                    </button>
                </div>
            </div>
        </nav>

    <main class="container mt-5">

        <div class="card-custom">

            <h1 class="titulo mb-3">Editar Doce</h1>

            <p class="mb-4">
                Atualize as informações do produto selecionado.
            </p>

            <div id="mensagem"></div>

            <form id="formDoce">

                <div class="mb-3">
                    <label for="nome" class="form-label">
                        Nome do doce
                    </label>

                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label">
                        Preço
                    </label>

                    <input
                        type="number"
                        id="preco"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>
                </div>

                <div class="mb-4">
                    <label for="quantidade" class="form-label">
                        Quantidade em estoque
                    </label>

                    <input
                        type="number"
                        id="quantidade"
                        class="form-control"
                        min="0"
                        required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-custom">
                        Salvar Alterações
                    </button>

                    <a href="index.html" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>

    </main>

    <script>
        const API_URL = "http://127.0.0.1:8000"

        const token = localStorage.getItem("token")
        const usuario = localStorage.getItem("usuario")

        if (!token) {
            window.location.href = "../login.html"
        }

        const usuarioLogado = document.getElementById("usuarioLogado")

        if (usuario) {
            usuarioLogado.textContent = `Logado como: ${usuario}`
        } else {
            usuarioLogado.textContent = "Usuário não identificado"
        }

        function sair() {
            localStorage.removeItem("token")
            localStorage.removeItem("usuario")
            window.location.href = "../login.html"
        }

        const params = new URLSearchParams(window.location.search)
        const id = params.get("id")

        const form = document.getElementById("formDoce")
        const mensagem = document.getElementById("mensagem")

        const campoNome = document.getElementById("nome")
        const campoPreco = document.getElementById("preco")
        const campoQuantidade = document.getElementById("quantidade")

        async function carregarDoce() {
            if (!id) {
                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        Doce não encontrado. Volte para a listagem e tente novamente.
                    </div>
                `
                form.style.display = "none"
                return
            }

            try {
                const resposta = await fetch(`${API_URL}/doces/${id}`)

                if (!resposta.ok) {
                    const erro = await resposta.json()
                    throw new Error(erro.detail || "Erro ao buscar doce")
                }

                const doce = await resposta.json()

                campoNome.value = doce.nome
                campoPreco.value = doce.preco
                campoQuantidade.value = doce.quantidade

            } catch (erro) {
                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        ${erro.message}
                    </div>
                `
                form.style.display = "none"
            }
        }

        form.addEventListener("submit", async function (e) {
            e.preventDefault()

            const nome = campoNome.value.trim()
            const preco = Number(campoPreco.value)
            const quantidade = Number(campoQuantidade.value)

            if (preco < 0 || quantidade < 0) {
                mensagem.innerHTML = `
                    <div class="alert alert-warning">
                        Preço e quantidade não podem ser negativos.
                    </div>
                `
                return
            }

            try {
                const resposta = await fetch(`${API_URL}/doces/${id}/substituir`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        nome,
                        preco,
                        quantidade
                    })
                })

                if (!resposta.ok) {
                    const erro = await resposta.json()
                    throw new Error(erro.detail || "Erro ao atualizar doce")
                }

                mensagem.innerHTML = `
                    <div class="alert alert-success">
                        Doce atualizado com sucesso!
                    </div>
                `

            } catch (erro) {
                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        ${erro.message}
                    </div>
                `
            }
        })

        carregarDoce()
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
