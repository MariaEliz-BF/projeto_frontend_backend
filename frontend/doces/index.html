<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doceria - Lista de Doces</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="#">
                Doceria
            </a>

            <!-- BOTÃO HAMBURGUER -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- MENU -->
            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Doces
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Pedidos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- CONTEÚDO -->
    <div class="container mt-5">

        <div class="card-custom">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h1 class="titulo">
                    Lista de Doces
                </h1>

                <a href="criar.html" class="btn btn-custom">
                    Novo Doce
                </a>

            </div>

            <div id="mensagem"></div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-doces">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script>

        async function carregarDoces() {

            const tabela = document.getElementById("tabela-doces")
            const mensagem = document.getElementById("mensagem")

            try {

                const resposta = await fetch("http://127.0.0.1:8000/doces")

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar doces")
                }

                const doces = await resposta.json()

                tabela.innerHTML = ""

                doces.forEach(doce => {

                    tabela.innerHTML += `
                        <tr>
                            <td>${doce.id}</td>
                            <td>${doce.nome}</td>
                            <td>R$ ${doce.preco}</td>
                            <td>${doce.quantidade}</td>

                            <td>

                                <a href="editar.html?id=${doce.id}" class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <button class="btn btn-danger btn-sm">
                                    Excluir
                                </button>

                            </td>
                        </tr>
                    `
                })

            } catch (erro) {

                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        Não foi possível carregar os doces.
                    </div>
                `
            }
        }

        carregarDoces()

    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
