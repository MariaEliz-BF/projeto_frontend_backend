<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doces da Mel | Gerenciar Doces</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>

    <nav class="navbar">

        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand" href="../index.html">
                Doces da Mel
            </a>

            <div class="usuario-area">

                <button
                    class="btn usuario-btn"
                    id="btnLogout"
                    title="Sair">

                    <i class="bi bi-box-arrow-right"></i>

                </button>

            </div>

        </div>

    </nav>

    <main class="container mt-5">

        <div class="card-custom">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h1 class="titulo mb-1">
                        Doces
                    </h1>

                    <p class="mb-0">
                        Gerencie os produtos cadastrados.
                    </p>

                </div>

                <a
                    href="criar.html"
                    class="btn btn-custom">

                    <i class="bi bi-plus-circle me-1"></i>

                    Cadastrar Doce

                </a>

            </div>

            <div class="mb-4">
                <div class="search-modern">

                    <i class="bi bi-search search-icon" id="btnBuscar"></i>

                    <input 
                        type="text" 
                        id="campoBusca" 
                        placeholder="Digite nome ou código"
                    >

                </div>
            </div>


            </div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Nome</th>

                            <th>Preço</th>

                            <th>Estoque</th>

                            <th width="180">
                                Ações
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tabela-doces">

                        <tr>

                        <td colspan="5" class="text-center py-4">

                        <div class="spinner-border spinner-border-sm me-2"></div>

                        Carregando doces...

                        </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="mt-4 d-flex justify-content-between">

                <a
                    href="../index.html"
                    class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-left me-1"></i>

                    Voltar ao Menu

                </a>

            </div>

        </div>

    </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

        <script src="/frontend/js/config.js"></script>
        <script src="/frontend/js/api.js"></script>
        <script src="/frontend/js/auth.js"></script>
        <script src="/frontend/js/ui.js"></script>

        <script src="/frontend/js/doces.js"></script>
    <script>
        const btnLogout = document.getElementById("btnLogout");

        if (btnLogout) {

            btnLogout.addEventListener("click", sair);

        }

    </script>

</body>

</html>
