<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doces da Mel | Novo Doce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

</head>

<body>

<nav class="navbar">

    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand" href="../index.html">
            Doces da Mel
        </a>

        <button
            class="btn usuario-btn"
            id="btnLogout"
            title="Sair">

            <i class="bi bi-box-arrow-right"></i>

        </button>

    </div>

</nav>

<main class="container mt-5">

    <div class="card-custom">

        <h1 class="titulo mb-3">
            Novo Doce
        </h1>

        <p class="mb-4">
            Cadastre um novo produto no sistema.
        </p>

        <form id="formDoce">

            <div class="mb-3">

                <label class="form-label">
                    Nome do doce
                </label>

                <input
                    type="text"
                    id="nome"
                    class="form-control"
                    placeholder="Ex: Brigadeiro"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Preço
                </label>

                <input
                    type="number"
                    id="preco"
                    class="form-control"
                    step="0.01"
                    min="0"
                    placeholder="Ex: 3,50"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Quantidade em estoque
                </label>

                <input
                    type="number"
                    id="quantidade"
                    class="form-control"
                    min="0"
                    placeholder="Ex: 20"
                    required>

            </div>

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-custom">

                    <i class="bi bi-plus-circle me-1"></i>

                    Salvar Doce

                </button>

                <a
                    href="index.html"
                    class="btn btn-outline-secondary">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>

<script>

protegerPagina();

document
    .getElementById("btnLogout")
    .addEventListener("click", sair);

const form = document.getElementById("formDoce");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const preco = Number(document.getElementById("preco").value);
    const quantidade = Number(document.getElementById("quantidade").value);

    if (preco < 0 || quantidade < 0) {

        mostrarToast(
            "Preço e quantidade não podem ser negativos.",
            "erro"
        );

        return;

    }

    confirmarAcao(

        "Cadastrar doce",

        "Deseja cadastrar este novo doce?",

        async () => {

            const resposta = await api.post("/doces/", {

                nome,
                preco,
                quantidade

            });
            console.log(resposta);
            if (!resposta.ok) {

                mostrarToast(

                    resposta.data?.detail ||
                    "Erro ao cadastrar doce.",

                    "erro"

                );

                return;

            }

            mostrarToast("Doce cadastrado com sucesso!");

            form.reset();

            document.getElementById("nome").focus();

        },

        "Cadastrar"

    );

});

</script>

</body>

</html>
