<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Doce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container position-relative">

            <button class="navbar-toggler menu-button-left" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
                <span class="navbar-toggler-icon"></span>
            </button>

            <a class="navbar-brand navbar-brand-center" href="index.html">
                Doceria
            </a>

            <div class="offcanvas offcanvas-start" tabindex="-1" id="menuLateral">
                <div class="offcanvas-header">
                    <h5 class="titulo-menu">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>

                <div class="offcanvas-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="../doces/index.html">Doces</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="../pedidos/index.html">Pedidos</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>

    <div class="container mt-5">

        <div class="card-custom">

            <h1 class="titulo mb-4">Cadastrar Doce</h1>

            <form id="formDoce">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do doce</label>
                    <input type="text" class="form-control" id="nome" required>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label">Preço</label>
                    <input type="number" step="0.01" class="form-control" id="preco" required>
                </div>

                <div class="mb-3">
                    <label for="quantidade" class="form-label">Quantidade</label>
                    <input type="number" class="form-control" id="quantidade" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-custom">
                        Salvar
                    </button>

                    <a href="index.html" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

            <div id="mensagem" class="mt-3"></div>

        </div>

    </div>

    <script>
        document.getElementById("formDoce").addEventListener("submit", async function (e) {
            e.preventDefault()

            const nome = document.getElementById("nome").value
            const preco = parseFloat(document.getElementById("preco").value)
            const quantidade = parseInt(document.getElementById("quantidade").value)

            try {
                const resposta = await fetch("http://127.0.0.1:8000/doces", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome,
                        preco,
                        quantidade
                    })
                })

                if (!resposta.ok) {
                    throw new Error("Erro ao cadastrar doce")
                }

                document.getElementById("mensagem").innerHTML = `
                    <div class="alert alert-success">
                        Doce cadastrado com sucesso!
                    </div>
                `

                document.getElementById("formDoce").reset()

            } catch (erro) {
                document.getElementById("mensagem").innerHTML = `
                    <div class="alert alert-danger">
                        Erro ao cadastrar doce. Verifique os dados e tente novamente.
                    </div>
                `
            }
        })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
