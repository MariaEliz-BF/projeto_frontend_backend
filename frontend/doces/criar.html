<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doceria - Novo Doce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <nav class="navbar">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="../index.html">Doceria</a>
        </div>
    </nav>

    <main class="container mt-5">

        <div class="card-custom">

            <h1 class="titulo mb-3">Novo Doce</h1>

            <p class="mb-4">
                Cadastre um novo produto no sistema.
            </p>

            <form id="formDoce">

                <div class="mb-3">
                    <label for="nome" class="form-label">
                        Nome do doce
                    </label>

                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        placeholder="Ex: Brigadeiro"
                        required>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label">
                        Preço
                    </label>

                    <input
                        type="number"
                        id="preco"
                        class="form-control"
                        step="0.01"
                        min="0"
                        placeholder="Ex: 3.50"
                        required>
                </div>

                <div class="mb-4">
                    <label for="quantidade" class="form-label">
                        Quantidade em estoque
                    </label>

                    <input
                        type="number"
                        id="quantidade"
                        class="form-control"
                        min="0"
                        placeholder="Ex: 20"
                        required>
                </div>

                <div id="mensagem"></div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-custom">
                        Salvar Doce
                    </button>

                    <a href="index.html" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>

    </main>

    <script>
        const API_URL = "http://127.0.0.1:8000"

        const form = document.getElementById("formDoce")
        const mensagem = document.getElementById("mensagem")

        form.addEventListener("submit", async function (e) {
            e.preventDefault()

            const nome = document.getElementById("nome").value.trim()
            const preco = Number(document.getElementById("preco").value)
            const quantidade = Number(document.getElementById("quantidade").value)

            if (preco < 0 || quantidade < 0) {
                mensagem.innerHTML = `
                    <div class="alert alert-warning">
                        Preço e quantidade não podem ser negativos.
                    </div>
                `
                return
            }

            try {
                const resposta = await fetch(`${API_URL}/doces/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome,
                        preco,
                        quantidade
                    })
                })

                if (!resposta.ok) {
                    const erro = await resposta.json()
                    throw new Error(erro.detail || "Erro ao cadastrar doce")
                }

                mensagem.innerHTML = `
                    <div class="alert alert-success">
                        Doce cadastrado com sucesso!
                    </div>
                `

                form.reset()

            } catch (erro) {
                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        ${erro.message}
                    </div>
                `
            }
        })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
