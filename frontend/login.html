<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doces da Mel - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="index.html">Doces da Mel</a>

            <button class="btn usuario-btn" onclick="trocarPerfil()" title="Trocar perfil">
                <i class="bi bi-person-circle"></i>
            </button>
        </div>
    </nav>

    <main class="container login-container">

        <div class="login-card">

            <h1 class="titulo text-center mb-2">Bem-vindo</h1>
            <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">
             Acesse sua conta para continuar
            </p>
    

            <form id="formLogin">

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="seu@email.com"
                        required>
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        class="form-control"
                        placeholder="Digite sua senha"
                        required>
                </div>

                <div id="mensagem"></div>

                <button type="submit" class="btn btn-custom w-100 mt-2">
                    Entrar
                </button>

                <div class="d-flex justify-content-end mt-2">
                    <a href="recuperar-senha.html" class="text-decoration-underline" style="font-size: 0.85rem;">
                        Esqueci minha senha
                    </a>
                </div>

                <div class="d-flex justify-content-end mt-1">
                    <a href="cadastro.html" class="text-decoration-underline" style="font-size: 0.85rem;">
                        Criar conta
                    </a>
                </div>

            <div class="text-center mt-4">
                <small class="text-muted">
                    Doces da Mel &copy; 2024. Todos os direitos reservados.
                </small>
            </div>

        </div>

    </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/login.js"></script>
</html>
