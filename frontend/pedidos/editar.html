<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pedido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container position-relative">

            <button class="navbar-toggler menu-button-left" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
                <span class="navbar-toggler-icon"></span>
            </button>

            <a class="navbar-brand navbar-brand-center" href="../doces/index.html">
                Doceria
            </a>

            <div class="offcanvas offcanvas-start" tabindex="-1" id="menuLateral">
                <div class="offcanvas-header">
                    <h5 class="titulo-menu">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>

                <div class="offcanvas-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="../doces/index.html">Doces</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="../pedidos/index.html">Pedidos</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>

    <div class="container mt-5">

        <div class="card-custom">

            <h1 class="titulo mb-4">Editar Pedido</h1>

            <form id="formEditarPedido">

                <div class="mb-3">
                    <label for="cliente" class="form-label">Cliente</label>
                    <input type="text" id="cliente" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="produtos" class="form-label">Selecionar produtos</label>

                    <select id="produtos" class="form-select" multiple>
                        <option value="Brigadeiro">Brigadeiro</option>
                        <option value="Beijinho">Beijinho</option>
                        <option value="Brownie">Brownie</option>
                        <option value="Bolo de pote">Bolo de pote</option>
                        <option value="Trufa">Trufa</option>
                        <option value="Cupcake">Cupcake</option>
                    </select>

                    <small class="text-muted">
                        Segure CTRL para selecionar mais de um produto.
                    </small>
                </div>

                <div class="mb-3">
                    <label for="valor_total" class="form-label">Valor Total</label>
                    <input type="number" id="valor_total" step="0.01" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="data" class="form-label">Data</label>
                    <input type="date" id="data" class="form-control" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-custom">
                        Salvar alterações
                    </button>

                    <a href="index.html" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

            <div id="mensagem" class="mt-3"></div>

        </div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search)
        const id = params.get("id")

        document.getElementById("formEditarPedido").addEventListener("submit", async function (e) {
            e.preventDefault()

            const cliente = document.getElementById("cliente").value
            const valor_total = parseFloat(document.getElementById("valor_total").value)
            const data = document.getElementById("data").value

            const produtosSelecionados = Array.from(
                document.getElementById("produtos").selectedOptions
            ).map(option => option.value)

            if (!id) {
                document.getElementById("mensagem").innerHTML = `
                    <div class="alert alert-danger">
                        Pedido não encontrado. Volte para a listagem e tente novamente.
                    </div>
                `
                return
            }

            if (produtosSelecionados.length === 0) {
                document.getElementById("mensagem").innerHTML = `
                    <div class="alert alert-warning">
                        Selecione pelo menos um produto para o pedido.
                    </div>
                `
                return
            }

            try {
                const resposta = await fetch(`http://127.0.0.1:8000/pedidos/${id}/substituir`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        cliente,
                        valor_total,
                        data
                    })
                })

                if (!resposta.ok) {
                    throw new Error("Erro ao atualizar pedido")
                }

                document.getElementById("mensagem").innerHTML = `
                    <div class="alert alert-success">
                        Pedido atualizado com sucesso!
                    </div>
                `

            } catch (erro) {
                document.getElementById("mensagem").innerHTML = `
                    <div class="alert alert-danger">
                        Erro ao atualizar pedido. Verifique os dados e tente novamente.
                    </div>
                `
            }
        })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
