<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doceria - Novo Pedido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <nav class="navbar">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="../index.html">Doceria</a>
        </div>
    </nav>

    <main class="container mt-5">

        <div class="card-custom">

            <h1 class="titulo mb-3">Novo Pedido</h1>

            <p class="mb-4">
                Selecione os doces e informe a quantidade desejada.
            </p>

            <form id="formPedido">

                <div class="mb-4">
                    <label for="cliente" class="form-label">Nome do cliente</label>
                    <input
                        type="text"
                        id="cliente"
                        class="form-control"
                        placeholder="Digite o nome do cliente"
                        required>
                </div>

                <div class="mb-4">
                    <label for="data" class="form-label">Data do pedido</label>
                    <input
                        type="date"
                        id="data"
                        class="form-control"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Doces disponíveis</label>

                    <div id="lista-produtos">
                        <div class="alert alert-info">
                            Carregando produtos...
                        </div>
                    </div>
                </div>

                <div class="mb-4 p-3 rounded total-box">
                    <strong>Prévia do total:</strong>
                    <span id="valorTotal">R$ 0,00</span>
                    <div class="small mt-1">
                    </div>
                </div>

                <div id="mensagem"></div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-custom">
                        Salvar Pedido
                    </button>

                    <a href="index.html" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>

    </main>

    <script>
        const API_URL = "http://127.0.0.1:8000"

        const listaProdutos = document.getElementById("lista-produtos")
        const valorTotal = document.getElementById("valorTotal")
        const mensagem = document.getElementById("mensagem")
        const inputData = document.getElementById("data")
        const formPedido = document.getElementById("formPedido")

        inputData.value = new Date().toISOString().split("T")[0]

        async function carregarProdutos() {
            try {
                const resposta = await fetch(`${API_URL}/doces/`)

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar doces")
                }

                const produtos = await resposta.json()

                if (!Array.isArray(produtos)) {
                    throw new Error("A API não retornou uma lista de doces.")
                }

                if (produtos.length === 0) {
                    listaProdutos.innerHTML = `
                        <div class="alert alert-warning">
                            Nenhum doce cadastrado no sistema.
                        </div>
                    `
                    return
                }

                listaProdutos.innerHTML = ""

                produtos.forEach(produto => {
                    listaProdutos.innerHTML += `
                        <div class="produto-item mb-3 p-3 rounded">
                            <div class="row align-items-center">

                                <div class="col-md-7">
                                    <strong>${produto.nome}</strong>

                                    <div class="text-muted small">
                                        ID: ${produto.id} |
                                        R$ ${Number(produto.preco).toFixed(2)} |
                                        Estoque: ${produto.quantidade}
                                    </div>
                                </div>

                                <div class="col-md-5 mt-2 mt-md-0">
                                    <label class="form-label small mb-1">
                                        Quantidade
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control quantidade-produto"
                                        min="0"
                                        max="${produto.quantidade}"
                                        value="0"
                                        data-id="${produto.id}"
                                        data-preco="${produto.preco}">
                                </div>

                            </div>
                        </div>
                    `
                })

                adicionarEventosQuantidade()

            } catch (erro) {
                listaProdutos.innerHTML = `
                    <div class="alert alert-danger">
                        ${erro.message}
                    </div>
                `
            }
        }

        function adicionarEventosQuantidade() {
            const quantidades = document.querySelectorAll(".quantidade-produto")

            quantidades.forEach(input => {
                input.addEventListener("input", function () {
                    if (Number(this.value) < 0) {
                        this.value = 0
                    }

                    if (Number(this.value) > Number(this.max)) {
                        this.value = this.max
                    }

                    calcularTotal()
                })
            })
        }

        function calcularTotal() {
            let total = 0

            const quantidades = document.querySelectorAll(".quantidade-produto")

            quantidades.forEach(input => {
                const preco = Number(input.dataset.preco)
                const quantidade = Number(input.value)

                if (quantidade > 0) {
                    total += preco * quantidade
                }
            })

            valorTotal.textContent = `R$ ${total.toFixed(2)}`
        }

        formPedido.addEventListener("submit", async function (e) {
            e.preventDefault()

            const cliente = document.getElementById("cliente").value.trim()
            const data = document.getElementById("data").value

            const quantidades = document.querySelectorAll(".quantidade-produto")

            const itens = Array.from(quantidades)
                .filter(input => Number(input.value) > 0)
                .map(input => {
                    return {
                        doce_id: Number(input.dataset.id),
                        quantidade: Number(input.value)
                    }
                })

            if (itens.length === 0) {
                mensagem.innerHTML = `
                    <div class="alert alert-warning">
                        Informe a quantidade de pelo menos um doce.
                    </div>
                `
                return
            }

            try {
                const resposta = await fetch(`${API_URL}/pedidos/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        cliente,
                        data,
                        itens
                    })
                })

                if (!resposta.ok) {
                    const erro = await resposta.json()
                    throw new Error(erro.detail || "Erro ao salvar pedido")
                }

                const pedidoCriado = await resposta.json()

                mensagem.innerHTML = `
                    <div class="alert alert-success">
                        Pedido cadastrado com sucesso! 
                        Total: R$ ${Number(pedidoCriado.valor_total).toFixed(2)}
                    </div>
                `

                formPedido.reset()
                inputData.value = new Date().toISOString().split("T")[0]
                valorTotal.textContent = "R$ 0,00"

                carregarProdutos()

            } catch (erro) {
                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        ${erro.message}
                    </div>
                `
            }
        })

        carregarProdutos()
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
