<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doces da Mel | Novo Pedido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand" href="../index.html">
                Doces da Mel
            </a>

            <div class="usuario-area">

                <span id="usuarioLogado" class="usuario-logado"></span>

                <button
                    class="btn usuario-btn"
                    onclick="sair()"
                    title="Sair">

                    <i class="bi bi-person-circle"></i>

                </button>

            </div>
        </div>
    </nav>

    <main class="container mt-5">

        <div class="card-custom">

            <h1 class="titulo mb-3">
                Novo Pedido
            </h1>

            <p class="mb-4">
                Selecione os doces e informe a quantidade desejada.
            </p>

            <form id="formPedido">

                <div class="mb-4">

                    <label class="form-label">
                        Nome do cliente
                    </label>

                    <input
                        type="text"
                        id="cliente"
                        class="form-control"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Data do pedido
                    </label>

                    <input
                        type="date"
                        id="data"
                        class="form-control"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Doces disponíveis
                    </label>

                    <div id="lista-produtos">

                        <div class="alert alert-info">
                            Carregando produtos...
                        </div>

                    </div>

                </div>

                <div class="mb-4 p-3 rounded total-box">

                    <strong>Prévia do total:</strong>

                    <span id="valorTotal">
                        R$ 0,00
                    </span>

                </div>

                <div id="mensagem"></div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        id="btnSalvar"
                        class="btn btn-custom">

                        Salvar Pedido

                    </button>

                    <a
                        href="index.html"
                        class="btn btn-secondary">

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>

    <script src="../js/pedido-criar.js"></script>

</body>

</html>
