<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doceria - Pedidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand" href="../index.html">
                Doceria
            </a>

            <div class="usuario-area">

                <span id="usuarioLogado" class="usuario-logado"></span>

                <button class="btn usuario-btn" onclick="sair()" title="Sair">
                    <i class="bi bi-person-circle"></i>
                </button>

            </div>

        </div>
    </nav>

    <!-- CONTEÚDO -->
    <main class="container mt-5">

        <div class="card-custom">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h1 class="titulo mb-0">Pedidos</h1>
                    <p class="mb-0">Gerencie as vendas cadastradas.</p>
                </div>

                <a href="criar.html" class="btn btn-custom">
                    Novo Pedido
                </a>

            </div>

            <!-- BUSCA -->
            <div class="mb-4">

                <div class="search-modern">

                    <i class="bi bi-search search-icon" id="btnBuscar"></i>

                    <input
                        type="text"
                        id="campoBusca"
                        placeholder="Digite nome ou ID do pedido">

                </div>

            </div>

            <div id="mensagem"></div>

            <!-- TABELA -->
            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Data</th>
                            <th>Itens</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-pedidos"></tbody>

                </table>

            </div>

            <!-- PAGINAÇÃO -->
            <div class="d-flex justify-content-between align-items-center mt-4">

                <button id="btnAnterior" class="btn btn-secondary" onclick="paginaAnterior()">
                    Anterior
                </button>

                <span id="infoPagina"></span>

                <button id="btnProximo" class="btn btn-secondary" onclick="proximaPagina()">
                    Próximo
                </button>

            </div>

            <a href="../index.html" class="btn btn-secondary mt-4">
                Voltar ao Menu
            </a>

        </div>

    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts do sistema -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pedidos.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            protegerPagina("admin");
            mostrarUsuario();
        });
    </script>

</body>

</html>
