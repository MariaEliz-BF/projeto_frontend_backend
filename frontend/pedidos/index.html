<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doceria - Pedidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="../index.html">Doceria</a>

            <div class="usuario-area">
                <span id="usuarioLogado" class="usuario-logado"></span>

                <button class="btn usuario-btn" onclick="sair()" title="Sair">
                    <i class="bi bi-person-circle"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mt-5">

        <div class="card-custom">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="titulo mb-0">Pedidos</h1>
                    <p class="mb-0">Gerencie as vendas cadastradas.</p>
                </div>

                <a href="criar.html" class="btn btn-custom">
                    Novo Pedido
                </a>
            </div>

            <div class="row mb-4">
                <div class="col-md-9">
                    <input
                        type="number"
                        id="campoBusca"
                        class="form-control"
                        placeholder="Buscar pedido por ID">
                </div>

                <div class="col-md-3 mt-2 mt-md-0">
                    <button class="btn btn-custom w-100" onclick="buscarPedidoPorId()">
                        Buscar
                    </button>
                </div>
            </div>

            <div id="mensagem"></div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Data</th>
                            <th>Itens</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-pedidos"></tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <button id="btnAnterior" class="btn btn-secondary" onclick="paginaAnterior()">
                    Anterior
                </button>

                <span id="infoPagina"></span>

                <button id="btnProximo" class="btn btn-secondary" onclick="proximaPagina()">
                    Próximo
                </button>
            </div>

            <a href="../index.html" class="btn btn-secondary mt-4">
                Voltar ao Menu
            </a>

        </div>

    </main>

    <script>
        const API_URL = "http://127.0.0.1:8000"

        const token = localStorage.getItem("token")
        const usuario = localStorage.getItem("usuario")

        if (!token) {
            window.location.href = "../login.html"
        }

        const usuarioLogado = document.getElementById("usuarioLogado")

        if (usuario) {
            usuarioLogado.textContent = `Logado como: ${usuario}`
        } else {
            usuarioLogado.textContent = "Usuário não identificado"
        }

        function sair() {
            localStorage.removeItem("token")
            localStorage.removeItem("usuario")
            window.location.href = "../login.html"
        }

        const tabela = document.getElementById("tabela-pedidos")
        const mensagem = document.getElementById("mensagem")
        const campoBusca = document.getElementById("campoBusca")
        const infoPagina = document.getElementById("infoPagina")
        const btnAnterior = document.getElementById("btnAnterior")
        const btnProximo = document.getElementById("btnProximo")

        let paginaAtual = 1
        const limite = 10
        let totalPaginas = 1

        function formatarData(data) {
            if (!data) {
                return ""
            }

            const partes = data.split("-")

            if (partes.length !== 3) {
                return data
            }

            const ano = partes[0]
            const mes = partes[1]
            const dia = partes[2]

            return `${dia}/${mes}/${ano}`
        }

        function formatarPreco(valor) {
            return Number(valor).toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            })
        }

        async function carregarPedidos(page = 1) {
            try {
                mensagem.innerHTML = ""

                const resposta = await fetch(`${API_URL}/pedidos/?page=${page}&limit=${limite}`)

                if (!resposta.ok) {
                    throw new Error("Erro ao carregar pedidos")
                }

                const resultado = await resposta.json()

                paginaAtual = resultado.page
                totalPaginas = resultado.pages || 1

                renderizarPedidos(resultado.data)
                atualizarPaginacao()

            } catch (erro) {
                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        Não foi possível carregar os pedidos. Verifique se a API está rodando.
                    </div>
                `
            }
        }

        function renderizarPedidos(pedidos) {
            tabela.innerHTML = ""

            if (!pedidos || pedidos.length === 0) {
                tabela.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                `
                return
            }

            pedidos.forEach(pedido => {
                let itens = "Sem itens"

                if (pedido.itens && pedido.itens.length > 0) {
                    itens = pedido.itens.map(item => {
                        return `${item.quantidade}x ${item.doce.nome}`
                    }).join("<br>")
                }

                tabela.innerHTML += `
                    <tr>
                        <td>${pedido.id}</td>
                        <td>${pedido.cliente}</td>
                        <td>${formatarData(pedido.data)}</td>
                        <td>${itens}</td>
                        <td>${formatarPreco(pedido.valor_total)}</td>
                        <td>
                            <a href="editar.html?id=${pedido.id}" class="btn btn-editar btn-sm">
                                Editar
                            </a>

                            <button class="btn btn-excluir btn-sm" onclick="excluirPedido(${pedido.id})">
                                Excluir
                            </button>
                        </td>
                    </tr>
                `
            })
        }

        function atualizarPaginacao() {
            infoPagina.textContent = `Página ${paginaAtual} de ${totalPaginas}`

            btnAnterior.disabled = paginaAtual <= 1
            btnProximo.disabled = paginaAtual >= totalPaginas
        }

        function paginaAnterior() {
            if (paginaAtual > 1) {
                carregarPedidos(paginaAtual - 1)
            }
        }

        function proximaPagina() {
            if (paginaAtual < totalPaginas) {
                carregarPedidos(paginaAtual + 1)
            }
        }

        async function buscarPedidoPorId() {
            const id = campoBusca.value.trim()

            if (id === "") {
                carregarPedidos(1)
                return
            }

            try {
                mensagem.innerHTML = ""

                const resposta = await fetch(`${API_URL}/pedidos/${id}`)

                if (!resposta.ok) {
                    const erro = await resposta.json()
                    throw new Error(erro.detail || "Pedido não encontrado")
                }

                const pedido = await resposta.json()

                renderizarPedidos([pedido])

                infoPagina.textContent = "Resultado da busca por ID"
                btnAnterior.disabled = true
                btnProximo.disabled = true

            } catch (erro) {
                tabela.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                `

                infoPagina.textContent = ""

                btnAnterior.disabled = true
                btnProximo.disabled = true

                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        ${erro.message}
                    </div>
                `
            }
        }

        campoBusca.addEventListener("input", function () {
            if (campoBusca.value.trim() === "") {
                carregarPedidos(1)
            }
        })

        campoBusca.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                buscarPedidoPorId()
            }
        })

        async function excluirPedido(id) {
            const confirmar = confirm("Tem certeza que deseja excluir este pedido?")

            if (!confirmar) {
                return
            }

            try {
                const resposta = await fetch(`${API_URL}/pedidos/${id}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                })

                if (!resposta.ok) {
                    const erro = await resposta.json()
                    throw new Error(erro.detail || "Erro ao excluir pedido")
                }

                mensagem.innerHTML = `
                    <div class="alert alert-success">
                        Pedido excluído com sucesso!
                    </div>
                `

                carregarPedidos(paginaAtual)

            } catch (erro) {
                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        ${erro.message}
                    </div>
                `
            }
        }

        carregarPedidos()
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
