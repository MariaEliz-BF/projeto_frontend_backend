<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doceria - Menu Principal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

     <nav class="navbar">
         <div class="container d-flex justify-content-between align-items-center">
         <a class="navbar-brand" href="index.html">Doceria</a>

          <div class="d-flex align-items-center gap-2">
                <span id="usuarioLogado" class="usuario-logado"></span>

                <button class="btn usuario-btn" onclick="trocarPerfil()" title="Trocar perfil">
                    <i class="bi bi-person-circle"></i>
                </button>
         </div>
     </div>
    </nav>

    <main class="container mt-5">

        <div class="card-custom text-center mb-4">
            <h1 class="titulo">Painel da Doceria</h1>
            <p>Escolha uma área para gerenciar o sistema.</p>
        </div>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card-custom h-100 text-center">
                    <h2 class="subtitulo-card">Doces</h2>
                    <p>Cadastre, edite, busque e exclua produtos.</p>
                    <a href="doces/index.html" class="btn btn-custom w-100">
                        Gerenciar Doces
                    </a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-custom h-100 text-center">
                    <h2 class="subtitulo-card">Vendas</h2>
                    <p>Registre uma nova venda para o cliente.</p>
                    <a href="vendas/index.html" class="btn btn-custom w-100">
                        Nova Venda
                    </a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-custom h-100 text-center">
                    <h2 class="subtitulo-card">Pedidos</h2>
                    <p>Liste, busque, edite e exclua pedidos.</p>
                    <a href="pedidos/index.html" class="btn btn-custom w-100">
                        Gerenciar Pedidos
                    </a>
                </div>
            </div>

        </div>

    </main>

    <script>
   
    const usuarioLogado = document.getElementById("usuarioLogado")
    const usuario = localStorage.getItem("usuario")

    if (usuario) {
        usuarioLogado.textContent = `Logado como: ${usuario}`
    } else {
        usuarioLogado.textContent = "Nenhum perfil logado"
    }

    function trocarPerfil() {
        localStorage.removeItem("token")
        localStorage.removeItem("usuario")
        window.location.href = "login.html"
    }

</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
