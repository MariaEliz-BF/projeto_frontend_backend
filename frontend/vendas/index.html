<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doceria - Delivery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="index.html">Doceria</a>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="card-custom">

            <h1 class="titulo mb-3">Fazer Pedido</h1>

            <p class="mb-4">
                Escolha seus doces e finalize seu pedido.
            </p>

            <form id="formPedido">

                <div class="mb-4">
                    <label for="cliente" class="form-label">Nome do cliente</label>
                    <input type="text" id="cliente" class="form-control" placeholder="Digite seu nome" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Produtos disponíveis</label>

                    <div id="lista-produtos">
                        <div class="alert alert-info">
                            Carregando produtos...
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="data" class="form-label">Data do pedido</label>
                    <input type="date" id="data" class="form-control" required>
                </div>

                <div class="mb-4 p-3 rounded total-box">
                    <strong>Total da compra:</strong>
                    <span id="valorTotal">R$ 0,00</span>
                </div>

                <div id="mensagem"></div>

                <button type="submit" class="btn btn-custom w-100">
                    Finalizar Pedido
                </button>

            </form>

        </div>
    </main>

    <script>
        const API_URL = "http://127.0.0.1:8000"

        const listaProdutos = document.getElementById("lista-produtos")
        const valorTotal = document.getElementById("valorTotal")
        const mensagem = document.getElementById("mensagem")
        const inputData = document.getElementById("data")

        inputData.value = new Date().toISOString().split("T")[0]

        async function carregarProdutos() {
            try {
                const resposta = await fetch(`${API_URL}/doces/`)

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar produtos")
                }

                const produtos = await resposta.json()

                console.log("Produtos recebidos:", produtos)

                if (!Array.isArray(produtos)) {
                    throw new Error("A API não retornou uma lista de produtos.")
                }

                if (produtos.length === 0) {
                    listaProdutos.innerHTML = `
                        <div class="alert alert-warning">
                            Nenhum produto cadastrado no sistema.
                        </div>
                    `
                    return
                }

                listaProdutos.innerHTML = ""

                produtos.forEach(produto => {
                    listaProdutos.innerHTML += `
                        <div class="produto-item mb-3 p-3 rounded">
                            <div class="d-flex justify-content-between align-items-center gap-3">

                                <div>
                                    <input
                                        class="form-check-input produto-check"
                                        type="checkbox"
                                        id="produto-${produto.id}"
                                        data-id="${produto.id}"
                                        data-preco="${produto.preco}">

                                    <label class="form-check-label ms-2" for="produto-${produto.id}">
                                        <strong>${produto.nome}</strong>
                                    </label>

                                    <div class="text-muted small">
                                        R$ ${Number(produto.preco).toFixed(2)} | Estoque: ${produto.quantidade}
                                    </div>
                                </div>

                                <div style="width: 95px;">
                                    <input
                                        type="number"
                                        class="form-control quantidade-produto"
                                        min="1"
                                        max="${produto.quantidade}"
                                        value="1"
                                        data-id="${produto.id}"
                                        disabled>
                                </div>

                            </div>
                        </div>
                    `
                })

                adicionarEventos()

            } catch (erro) {
                console.error("Erro:", erro)

                listaProdutos.innerHTML = `
                    <div class="alert alert-danger">
                        ${erro.message}
                    </div>
                `
            }
        }

        function adicionarEventos() {
            const checkboxes = document.querySelectorAll(".produto-check")
            const quantidades = document.querySelectorAll(".quantidade-produto")

            checkboxes.forEach(checkbox => {
                checkbox.addEventListener("change", function () {
                    const id = this.dataset.id
                    const inputQuantidade = document.querySelector(`.quantidade-produto[data-id="${id}"]`)

                    inputQuantidade.disabled = !this.checked

                    calcularTotal()
                })
            })

            quantidades.forEach(input => {
                input.addEventListener("input", calcularTotal)
            })
        }

        function calcularTotal() {
            let total = 0

            const selecionados = document.querySelectorAll(".produto-check:checked")

            selecionados.forEach(checkbox => {
                const id = checkbox.dataset.id
                const preco = Number(checkbox.dataset.preco)
                const quantidade = Number(document.querySelector(`.quantidade-produto[data-id="${id}"]`).value)

                total += preco * quantidade
            })

            valorTotal.textContent = `R$ ${total.toFixed(2)}`
        }

        document.getElementById("formPedido").addEventListener("submit", async function (e) {
            e.preventDefault()

            const cliente = document.getElementById("cliente").value.trim()
            const data = document.getElementById("data").value
            const selecionados = document.querySelectorAll(".produto-check:checked")

            if (selecionados.length === 0) {
                mensagem.innerHTML = `
                    <div class="alert alert-warning">
                        Selecione pelo menos um produto.
                    </div>
                `
                return
            }

            const itens = Array.from(selecionados).map(checkbox => {
                const id = checkbox.dataset.id
                const quantidade = Number(document.querySelector(`.quantidade-produto[data-id="${id}"]`).value)

                return {
                    doce_id: Number(id),
                    quantidade: quantidade
                }
            })

            try {
                const resposta = await fetch(`${API_URL}/pedidos/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        cliente,
                        data,
                        itens
                    })
                })

                if (!resposta.ok) {
                    const erro = await resposta.json()
                    throw new Error(erro.detail || "Erro ao finalizar pedido")
                }

                mensagem.innerHTML = `
                    <div class="alert alert-success">
                        Pedido realizado com sucesso!
                    </div>
                `

                this.reset()
                inputData.value = new Date().toISOString().split("T")[0]
                valorTotal.textContent = "R$ 0,00"

                carregarProdutos()

            } catch (erro) {
                mensagem.innerHTML = `
                    <div class="alert alert-danger">
                        ${erro.message}
                    </div>
                `
            }
        })

        carregarProdutos()
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
