<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doces da Mel | Cliente - Pedido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand" href="home.html">
                Doces da Mel
            </a>

            <div class="usuario-area">

                <span id="usuarioLogado" class="usuario-logado"></span>

                <button
                    class="btn usuario-btn"
                    id="btnLogout"
                    title="Sair">

                    <i class="bi bi-box-arrow-right"></i>

                </button>

            </div>

        </div>

    </nav>

    <!-- CONTEÚDO -->
    <main class="container mt-5">

        <div class="card-custom">

            <div class="mb-4">

                <h1 class="titulo">
                    Fazer Pedido
                </h1>

                <p class="mb-0">
                    Escolha os doces e quantidades desejadas.
                </p>

            </div>

            <form id="formPedido">

                <!-- CLIENTE (auto) -->
                <div class="mb-4">

                    <label class="form-label">
                        Cliente
                    </label>

                    <input
                        type="text"
                        id="cliente"
                        class="form-control"
                        readonly>

                </div>

                <!-- DATA -->
                <div class="mb-4">

                    <label class="form-label">
                        Data do pedido
                    </label>

                    <input
                        type="date"
                        id="data"
                        class="form-control"
                        required>

                </div>

                <!-- LISTA DE PRODUTOS -->
                <div class="mb-4">

                    <label class="form-label">
                        Doces disponíveis
                    </label>

                    <div id="lista-doces">

                        <div class="alert alert-info">
                            Carregando doces...
                        </div>

                    </div>

                </div>

                <!-- TOTAL -->
                <div class="mb-4 p-3 rounded total-box">

                    <strong>Total:</strong>
                    <span id="total">R$ 0,00</span>

                </div>

                <!-- MENSAGEM -->
                <div id="msg"></div>

                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-custom">
                        Enviar Pedido
                    </button>

                    <a href="home.html" class="btn btn-secondary">
                        Voltar
                    </a>

                </div>

            </form>

        </div>

    </main>
