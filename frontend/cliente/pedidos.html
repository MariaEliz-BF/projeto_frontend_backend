<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doces da Mel | Cliente - Pedido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand" href="home.html">
            Doces da Mel
        </a>

        <div class="usuario-area">

            <span id="usuarioLogado" class="usuario-logado"></span>

            <button class="btn usuario-btn" id="btnLogout">
                <i class="bi bi-box-arrow-right"></i>
            </button>

        </div>

    </div>

</nav>

<!-- CONTEÚDO -->
<main class="container mt-5">

    <div class="card-custom">

        <h1 class="titulo mb-1">Fazer Pedido</h1>
        <p class="mb-4">Escolha os doces e quantidades desejadas.</p>

        <form id="formPedido">

            <!-- CLIENTE -->
            <div class="mb-3">
                <label class="form-label">Cliente</label>
                <input type="text" id="cliente" class="form-control" readonly>
            </div>

            <!-- DATA -->
            <div class="mb-4">
                <label class="form-label">Data</label>
                <input type="date" id="data" class="form-control" required>
            </div>

            <!-- DOCES -->
            <div class="mb-3">
                <label class="form-label">Doces disponíveis</label>

                <div id="lista-doces" class="row g-3">
                    <div class="text-muted">Carregando...</div>
                </div>

            </div>

            <!-- TOTAL -->
            <div class="total-box p-3 rounded mb-3">
                <strong>Total:</strong>
                <span id="total">R$ 0,00</span>
            </div>

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-custom">
                    Enviar Pedido
                </button>

                <a href="home.html" class="btn btn-secondary">
                    Voltar
                </a>

            </div>

        </form>

    </div>

</main>

<!-- SCRIPTS BASE -->
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>

<!-- Bootstrap JS (OBRIGATÓRIO pro modal funcionar) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
let doces = [];
let carrinho = {};

// INIT
document.addEventListener("DOMContentLoaded", async () => {

    const usuario = localStorage.getItem("usuario");

    if (!usuario) {
        window.location.href = "../login.html";
        return;
    }

    document.getElementById("cliente").value = usuario;
    document.getElementById("data").value = new Date().toISOString().split("T")[0];
    document.getElementById("usuarioLogado").innerText = usuario;

    document.getElementById("btnLogout").addEventListener("click", () => {
        localStorage.clear();
        window.location.href = "../login.html";
    });

    await carregarDoces();
});

// =============================
// DOCES
// =============================
async function carregarDoces() {

    const container = document.getElementById("lista-doces");

    const res = await api.get("/doces/");

    if (!res.ok) {
        mostrarToast("Erro ao carregar doces", "erro");
        return;
    }

    doces = res.data;
    container.innerHTML = "";

    doces.forEach(d => {

        container.innerHTML += `
        <div class="col-6 col-md-4 col-lg-3">

            <div class="card p-3 h-100" style="border-radius:15px; border:1px solid #f4d4d4;">

                <h6 class="mb-1" style="color:#7b3b11">${d.nome}</h6>

                <small class="text-muted">
                    ${Number(d.preco).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
                </small>

                <input type="number"
                    class="form-control form-control-sm mt-2"
                    min="0"
                    value="0"
                    onchange="atualizarCarrinho(${d.id}, this.value)">
            </div>

        </div>
        `;
    });
}

// =============================
// CARRINHO
// =============================
function atualizarCarrinho(id, qtd) {

    qtd = Number(qtd);

    if (qtd <= 0) delete carrinho[id];
    else carrinho[id] = qtd;

    calcularTotal();
}

// =============================
// TOTAL
// =============================
function calcularTotal() {

    let total = 0;

    for (let id in carrinho) {
        const d = doces.find(x => x.id == id);
        if (d) total += d.preco * carrinho[id];
    }

    document.getElementById("total").innerText =
        total.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });
}

// =============================
// SUBMIT COM CONFIRMAÇÃO
// =============================
document.getElementById("formPedido").addEventListener("submit", async (e) => {

    e.preventDefault();

    const itens = Object.keys(carrinho).map(id => ({
        doce_id: Number(id),
        quantidade: carrinho[id]
    }));

    if (!itens.length) {
        mostrarToast("Selecione pelo menos um doce", "aviso");
        return;
    }

    confirmarAcao(
        "Confirmar pedido",
        "Tem certeza que deseja enviar esse pedido?",
        async () => {

            const res = await api.post("/pedidos/", {
                cliente: document.getElementById("cliente").value,
                data: document.getElementById("data").value,
                itens
            });

            if (!res.ok) {
                mostrarToast("Erro ao enviar pedido", "erro");
                return;
            }

            mostrarToast("Pedido enviado com sucesso!", "sucesso");

            carrinho = {};
            carregarDoces();
            calcularTotal();
        }
    );
});
</script>

</body>
</html>
