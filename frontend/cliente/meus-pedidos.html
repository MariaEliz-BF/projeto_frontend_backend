<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doces da Mel | Meus Pedidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand" href="home.html">
            Doces da Mel
        </a>

        <div class="usuario-area">

            <span id="usuarioLogado" class="usuario-logado"></span>

            <button class="btn usuario-btn" id="btnLogout">
                <i class="bi bi-box-arrow-right"></i>
            </button>

        </div>

    </div>
</nav>

<!-- CONTEÚDO -->
<main class="container mt-5">

    <div class="card-custom">

        <!-- HEADER COM BOTÃO VOLTAR -->
        <div class="d-flex justify-content-between align-items-center mb-3">

            <div>
                <h1 class="titulo mb-0">Meus Pedidos</h1>
                <p class="mb-0 text-muted">Todos os pedidos realizados</p>
            </div>

            <a href="home.html" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>

        </div>

        <!-- LISTA -->
        <div id="listaPedidos" class="row g-3">
            <div class="text-muted">Carregando pedidos...</div>
        </div>

    </div>

</main>

<!-- SCRIPTS -->
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>

<script>
let usuario = null;

document.addEventListener("DOMContentLoaded", async () => {

    usuario = localStorage.getItem("usuario");

    if (!usuario) {
        window.location.href = "../login.html";
        return;
    }

    document.getElementById("usuarioLogado").innerText = usuario;

    document.getElementById("btnLogout").addEventListener("click", () => {
        localStorage.clear();
        window.location.href = "../login.html";
    });

    await carregarPedidos();
});

async function carregarPedidos() {

    const container = document.getElementById("listaPedidos");

    let page = 1;
    let todosPedidos = [];
    let totalPages = 1;

    do {

        const res = await api.get(`/pedidos/?page=${page}&limit=50`);

        if (!res.ok) {
            container.innerHTML = `<p class="text-danger">Erro ao carregar pedidos</p>`;
            return;
        }

        const data = res.data;

        todosPedidos = todosPedidos.concat(data.data);

        totalPages = data.pages;
        page++;

    } while (page <= totalPages);

    const meusPedidos = todosPedidos.filter(p => p.cliente === usuario);

    if (!meusPedidos.length) {
        container.innerHTML = `<p class="text-muted">Você ainda não fez pedidos.</p>`;
        return;
    }

    container.innerHTML = "";

    meusPedidos.forEach(p => {

        container.innerHTML += `
        <div class="col-12">
            <div class="card p-3" style="border-radius:15px; border:1px solid #f4d4d4;">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h5 class="mb-1" style="color:#7b3b11;">
                            Pedido #${p.id}
                        </h5>

                        <small class="text-muted">
                            Data: ${p.data}
                        </small>
                    </div>

                    <div class="text-end">
                        <strong>Total</strong><br>
                        <span style="color:#7b3b11;">
                            ${Number(p.valor_total).toLocaleString("pt-BR", {
                                style: "currency",
                                currency: "BRL"
                            })}
                        </span>
                    </div>

                </div>

            </div>
        </div>
        `;
    });
}
</script>

</body>
</html>
